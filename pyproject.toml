[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedramp-docs-mcp"
version = "0.1.0"
description = "An unofficial Model Context Protocol (MCP) server exposing the public FedRAMP 20x machine-readable documentation (FRMR) as deterministic, citable lookup tools."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "fedramp-docs-mcp contributors" }
]
keywords = ["mcp", "fedramp", "frmr", "compliance", "claude", "anthropic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "mcp[cli]>=1.6.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/andrewnolan/fedramp-docs-mcp"
Repository = "https://github.com/andrewnolan/fedramp-docs-mcp"
Issues = "https://github.com/andrewnolan/fedramp-docs-mcp/issues"
"FedRAMP Docs Upstream" = "https://github.com/FedRAMP/docs"

[project.scripts]
fedramp-docs-mcp = "fedramp_docs_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fedramp_docs_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/fedramp_docs_mcp/data/FRMR.documentation.json" = "fedramp_docs_mcp/data/FRMR.documentation.json"
"src/fedramp_docs_mcp/data/SOURCE_VERSION.json" = "fedramp_docs_mcp/data/SOURCE_VERSION.json"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
